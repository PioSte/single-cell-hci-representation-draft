[project]
name = "single-cell-hci-representation-draft"
version = "0.1.0"
description = "Padding-free channel-set fusion tokenizer for high-content-imaging foundation models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
authors = [{ name = "Piotr Stępień" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
viz = [
    "marimo>=0.9",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pillow>=10",
    "torchview>=0.2.6",
    "graphviz>=0.20",
    "kinemo>=0.19",
]
flash = ["flash-attn>=2.5; platform_system != 'Darwin'"]
io = ["tifffile>=2024.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuse_channels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# viz/ is throwaway figure-drawing code, not library surface.
extend-exclude = ["viz"]
# Keep that exclusion when pre-commit passes explicit staged paths.
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["fuse_channels"]

# Type-check the library only; tests/ still carry a typing backlog.
[tool.ty.src]
include = ["src"]

[tool.ty.rules]
# ``self.forward = partial(...)`` is the standard torch way to specialize a
# forward pass; ty reads it as a mutable override of ``Module.forward``.
invalid-mutable-override = "ignore"
