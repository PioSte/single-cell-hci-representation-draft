[project]
name = "fuse-channels"
version = "0.1.0"
description = "Padding-free channel-set fusion front-end for high-content-imaging foundation models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "fuse-channels" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
viz = [
    "marimo>=0.9",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pillow>=10",
    "torchview>=0.2.6",
    "graphviz>=0.20",
    "kinemo>=0.19",
]
flash = ["flash-attn>=2.5; platform_system != 'Darwin'"]
text = ["transformers>=4.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuse_channels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
